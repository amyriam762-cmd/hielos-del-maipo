<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Hielo picado para restaurantes y bares">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d3f8a"/>
      <stop offset="1" stop-color="#12a3c4"/>
    </linearGradient>
    <linearGradient id="cubo2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f2fdff"/>
      <stop offset="1" stop-color="#9fdcf1"/>
    </linearGradient>
  </defs>
  <rect width="400" height="240" fill="url(#bg2)"/>
  <circle cx="70" cy="50" r="100" fill="#ffffff" opacity=".06"/>
  <ellipse cx="200" cy="214" rx="150" ry="18" fill="#04151f" opacity=".3"/>

  <!-- vaso -->
  <path d="M150 60h100l-10 130a14 14 0 0 1-14 12h-52a14 14 0 0 1-14-12z" fill="#ffffff" opacity=".14" stroke="#eaf9ff" stroke-opacity=".55" stroke-width="2"/>
  <path d="M156 120h88l-7 70a10 10 0 0 1-10 9h-54a10 10 0 0 1-10-9z" fill="#8fe3fa" opacity=".35"/>

  <!-- hielos dentro del vaso -->
  <g fill="url(#cubo2)">
    <rect x="168" y="112" width="34" height="34" rx="6" transform="rotate(-12 185 129)"/>
    <rect x="200" y="96" width="30" height="30" rx="6" transform="rotate(18 215 111)"/>
    <rect x="196" y="132" width="36" height="36" rx="6" transform="rotate(-6 214 150)"/>
    <rect x="168" y="152" width="30" height="30" rx="6" transform="rotate(22 183 167)"/>
  </g>

  <!-- hielo picado fuera -->
  <g fill="#dff7ff" opacity=".9">
    <rect x="96" y="180" width="16" height="16" rx="3" transform="rotate(18 104 188)"/>
    <rect x="118" y="196" width="12" height="12" rx="2" transform="rotate(-24 124 202)"/>
    <rect x="286" y="176" width="18" height="18" rx="3" transform="rotate(-14 295 185)"/>
    <rect x="266" y="198" width="12" height="12" rx="2" transform="rotate(30 272 204)"/>
  </g>

  <g fill="#ffffff" opacity=".85">
    <path d="M300 60l2 6 6 2-6 2-2 6-2-6-6-2 6-2z"/>
    <path d="M110 96l2 5 5 2-5 2-2 5-2-5-5-2 5-2z"/>
  </g>
</svg>
