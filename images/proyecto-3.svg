<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Barras de hielo para empresas y minimarkets">
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#062b3a"/>
      <stop offset="1" stop-color="#0f7fa6"/>
    </linearGradient>
    <linearGradient id="barra3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f2fdff"/>
      <stop offset=".55" stop-color="#bfeaf8"/>
      <stop offset="1" stop-color="#7fcfe8"/>
    </linearGradient>
  </defs>
  <rect width="400" height="240" fill="url(#bg3)"/>
  <circle cx="340" cy="200" r="120" fill="#ffffff" opacity=".06"/>
  <ellipse cx="200" cy="208" rx="150" ry="18" fill="#000000" opacity=".35"/>

  <!-- barra de hielo en perspectiva -->
  <g>
    <polygon points="120,96 250,66 322,102 192,134" fill="url(#barra3)"/>
    <polygon points="120,96 192,134 192,196 120,158" fill="#9fdcf1"/>
    <polygon points="192,134 322,102 322,164 192,196" fill="#63c2e0"/>
    <polygon points="140,104 236,82 258,93 162,115" fill="#ffffff" opacity=".55"/>
    <g stroke="#ffffff" stroke-opacity=".45" stroke-width="2" stroke-linecap="round">
      <path d="M206 128l8 56"/>
      <path d="M240 120l8 56"/>
      <path d="M274 112l8 56"/>
    </g>
  </g>

  <!-- cajas apiladas -->
  <g>
    <rect x="286" y="176" width="44" height="34" rx="4" fill="#0d3f8a" stroke="#8fe3fa" stroke-opacity=".6"/>
    <rect x="332" y="188" width="34" height="22" rx="4" fill="#0d3f8a" stroke="#8fe3fa" stroke-opacity=".6"/>
    <path d="M286 190h44" stroke="#8fe3fa" stroke-opacity=".4"/>
  </g>

  <g fill="#ffffff" opacity=".8">
    <path d="M86 58l3 7 7 3-7 3-3 7-3-7-7-3 7-3z"/>
    <path d="M110 40l2 5 5 2-5 2-2 5-2-5-5-2 5-2z"/>
    <path d="M330 70l2 5 5 2-5 2-2 5-2-5-5-2 5-2z"/>
